name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ ./cmd/kdeck

  # The release pipeline without publishing: every binary, archive and Linux
  # package, then the .deb, .rpm and .apk installed in their distributions.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,sbom
        env:
          HOMEBREW_TAP_DEPLOY_KEY: unused
          SCOOP_BUCKET_DEPLOY_KEY: unused
      - name: install the packages
        run: |
          check='kdeck about && kdeck alias explain kgpo && test -f /usr/share/bash-completion/completions/kdeck'
          docker run --rm -v "$PWD/dist:/d" debian:stable-slim sh -c "dpkg -i /d/kdeck_*_linux_amd64.deb && $check"
          docker run --rm -v "$PWD/dist:/d" rockylinux:9-minimal sh -c "rpm -i /d/kdeck_*_linux_amd64.rpm && $check"
          docker run --rm -v "$PWD/dist:/d" alpine:3 sh -c "apk add --allow-untrusted /d/kdeck_*_linux_amd64.apk && $check"

  e2e:
    name: e2e (Kubernetes ${{ matrix.node }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # kdeck supports Kubernetes 1.31 up to the embedded kubectl minor (+1).
        # Keep one exact kindest/node tag per supported minor
        # (https://hub.docker.com/r/kindest/node/tags); raise the oldest only
        # together with setup.OldestSupportedMinor and the README.
        node: ["v1.31.14", "v1.32.11", "v1.33.12", "v1.34.11", "v1.35.8", "v1.36.4", "v1.37.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/kdeck ./cmd/kdeck
      - uses: helm/kind-action@v1
        with:
          # The action default, kind v0.31.0, writes kubeadm v1beta3 config, which 1.37 rejects.
          version: v0.33.0
          node_image: kindest/node:${{ matrix.node }}
          cluster_name: kdeck-e2e
      - name: planted silent failures, guard and shortcuts
        run: ./hack/e2e.sh ./bin/kdeck
