name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ ./cmd/kdeck

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build all release targets
        run: |
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/kdeck
          done

  e2e:
    name: e2e (Kubernetes ${{ matrix.node }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # kdeck supports Kubernetes 1.31 up to the embedded kubectl minor (+1).
        # Keep one exact kindest/node tag per supported minor
        # (https://hub.docker.com/r/kindest/node/tags); raise the oldest only
        # together with setup.OldestSupportedMinor and the README.
        node: ["v1.31.14", "v1.32.11", "v1.33.12", "v1.34.11", "v1.35.8", "v1.36.4", "v1.37.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/kdeck ./cmd/kdeck
      - uses: helm/kind-action@v1
        with:
          # The action default, kind v0.31.0, writes kubeadm v1beta3 config, which 1.37 rejects.
          version: v0.33.0
          node_image: kindest/node:${{ matrix.node }}
          cluster_name: kdeck-e2e
      - name: planted silent failures, guard and shortcuts
        run: ./hack/e2e.sh ./bin/kdeck
